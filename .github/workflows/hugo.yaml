name: Build and deploy

# 站点「zxc」：push 到 main 即自动构建并发布到 GitHub Pages。
# baseURL 由 configure-pages 输出注入，项目页（/仓库名/）与用户页（根路径）都适用，
# 无需在 hugo.toml 里写死域名。

env:
  HUGO_VERSION: 0.169.0
  TZ: Asia/Shanghai

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # 主题 PaperMod 已作为普通文件入库，无需 submodule；项目没有 go.mod / package-lock.json，
      # 样式为纯 CSS，无需 Dart Sass / Go / Node。但主题的 fastsearch.js 用了 js.Build，
      # 因此必须用 Hugo extended 版（与本地构建验证用的 0.169.0+extended 保持一致）。
      - name: Install Hugo
        run: |
          set -euo pipefail
          V="${HUGO_VERSION}"
          BASE="https://github.com/gohugoio/hugo/releases/download/v${V}"
          TARBALL="${{ runner.temp }}/hugo.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          for name in "hugo_extended_${V}_linux-amd64" "hugo_extended_withdeploy_${V}_linux-amd64"; do
            if curl -sfL -o "${TARBALL}" "${BASE}/${name}.tar.gz"; then
              echo "已下载 ${name}.tar.gz"
              break
            fi
          done
          if [ ! -f "${TARBALL}" ]; then
            echo "::error::Hugo ${V} extended 版下载失败，请检查 HUGO_VERSION"
            exit 1
          fi
          tar -C "${HOME}/.local/hugo" -xf "${TARBALL}"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Log versions
        run: |
          hugo version
          hugo version | grep -q extended || {
            echo "::error::需要 Hugo extended 版（主题 fastsearch.js 使用 js.Build）"
            exit 1
          }

      - name: Build
        run: |
          hugo build \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --cacheDir "${{ runner.temp }}/.cache/hugo"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          include-hidden-files: false
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
